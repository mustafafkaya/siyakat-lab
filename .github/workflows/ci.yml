name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siyakat
          POSTGRES_PASSWORD: siyakat
          POSTGRES_DB: siyakat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest.py bu değişkeni okur ve şemayı create_all ile kurar.
      TEST_DATABASE_URL: postgresql://siyakat:siyakat@localhost:5432/siyakat_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siyakat
          POSTGRES_PASSWORD: siyakat
          POSTGRES_DB: siyakat_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://siyakat:siyakat@localhost:5432/siyakat_e2e
      STORAGE_ROOT: /tmp/siyakat_e2e_storage
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend kur + şema + demo veri
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p "$STORAGE_ROOT"
          python -c "from app.core.database import Base, engine; import app.models; Base.metadata.create_all(bind=engine)"
          python -m scripts.seed_demo

      - name: Backend'i başlat
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/samples > /dev/null && break; sleep 1; done

      - name: Frontend kur + build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Playwright tarayıcısı
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E testleri
        working-directory: frontend
        run: npm run test:e2e

      - name: Hata çıktıları
        if: failure()
        run: cat /tmp/uvicorn.log || true
